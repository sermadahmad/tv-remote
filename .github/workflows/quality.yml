name: Quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: node scripts/verify-fixtures.mjs
      - run: node scripts/verify-native-linking.mjs
      - run: npm run test:coverage
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx expo export --platform ios --platform android --max-workers 2
  android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew :tv-remote-native:testDebugUnitTest :app:assembleDebug --console=plain
        working-directory: android
  ios:
    runs-on: macos-latest
    env:
      CI: '1'
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: swift test --package-path modules/tv-remote-native/ios/Core
      - run: node scripts/test-ios-credentials.mjs
      - run: npx expo prebuild --platform ios
      - run: xcodebuild -workspace ios/UniversalTVRemote.xcworkspace -scheme UniversalTVRemote -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
