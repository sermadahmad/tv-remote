appId: com.sermadahmad.tvremote
name: Real adapter simulator launch
---
- launchApp:
    clearState: true
- openLink: universaltvremote://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1
- tapOn:
    text: Open
    optional: true
- runFlow:
    when:
      visible: http://
    commands:
      - tapOn: http://
      - inputText: http://localhost:8081
      - tapOn:
          text: Connect
          optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible: Let’s connect your TV.
    timeout: 120000
- assertNotVisible: 'UI TEST.*'
- takeScreenshot: production-onboarding
- scrollUntilVisible:
    element: Find my TV
- tapOn: Find my TV
- tapOn:
    text: Allow
    optional: true
- assertVisible: Find your TV.
- extendedWaitUntil:
    visible: 'Searching for your TV.*|We couldn’t find your TV.|Connect to .*|Connect your phone to Wi-Fi.*|Allow the app to find devices.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'We couldn’t find your TV.|Connect to .*|Connect your phone to Wi-Fi.*|Allow the app to find devices.*'
    timeout: 30000
- assertNotVisible: '.*Simulated.*'
- takeScreenshot: production-discovery
- scrollUntilVisible:
    element: Advanced connection options
- tapOn: Advanced connection options
- scrollUntilVisible:
    element: Connect using IP address
- tapOn: Connect using IP address
- scrollUntilVisible:
    element: TV IP address
- tapOn: TV IP address
- inputText: 8.8.8.8
- assertVisible: Connect to this address
- takeScreenshot: production-address-keyboard
- tapOn: Connect to this address
- assertVisible: 'Enter four numbers separated by dots.*'
- back
- tapOn: Remote
- assertVisible: Choose a TV
- tapOn: Saved
- assertVisible: No saved TVs yet.
- tapOn: Settings
- assertVisible: Match system · Selected
- tapOn: Remote
- assertVisible: Choose a TV
