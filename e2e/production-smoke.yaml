appId: com.sermadahmad.tvremote
name: Real adapter simulator launch
---
- launchApp:
    clearState: true
- openLink: universaltvremote://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1
- tapOn:
    text: Open
    optional: true
- runFlow:
    when:
      visible: http://
    commands:
      - tapOn: http://
      - inputText: http://localhost:8081
      - tapOn:
          text: Connect
          optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible: Find my TV
    timeout: 120000
- assertNotVisible: 'UI TEST.*'
- takeScreenshot: production-onboarding
- scrollUntilVisible:
    element: Find my TV
- tapOn: Find my TV
- tapOn:
    text: Allow
    optional: true
- assertVisible: Make yourself at home.
- extendedWaitUntil:
    visible: 'Looking for your TV.*|No TVs found yet|Connect to .*|Connect your phone and TV.*|Allow local network access.*'
    timeout: 30000
- assertNotVisible: '.*Simulated.*'
- takeScreenshot: production-discovery
- tapOn: Enter TV IP address
- scrollUntilVisible:
    element: TV IP address
- tapOn: TV IP address
- inputText: 8.8.8.8
- assertVisible: Connect to this address
- takeScreenshot: production-address-keyboard
- tapOn: Connect to this address
- assertVisible: 'Enter a private local IP address.*'
- back
- tapOn: Remote
- assertVisible: Choose a TV
- tapOn: Saved
- assertVisible: No saved TVs yet.
- tapOn: Settings
- assertVisible: Match system · Selected
- tapOn: Remote
- assertVisible: Choose a TV
