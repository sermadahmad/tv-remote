appId: com.sermadahmad.tvremote.uitest
name: Explicit simulated TV journey
---
- launchApp:
    clearState: true
- openLink: 'universaltvremote-uitest://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- extendedWaitUntil:
    visible: 'UI TEST.*SIMULATED TV.*'
    timeout: 120000
- scrollUntilVisible:
    element: Find my TV
- tapOn: Find my TV
- assertVisible: Devices
- assertVisible: Remote
- tapOn: Connect to Living Room · Simulated
- assertVisible: A small introduction.
- tapOn: Cancel connection
- tapOn: Connect to Living Room · Simulated
- tapOn: TV pairing code
- inputText: '000000'
- assertVisible: Pair securely
- takeScreenshot: simulated-pairing-keyboard
- tapOn: Pair securely
- assertVisible: 'Enter the six characters shown on the TV.*'
- tapOn:
    text: Dismiss message
    optional: true
- tapOn: TV pairing code
- inputText: A1B2C3
- pressKey: Enter
- extendedWaitUntil:
    visible: Connected · Local Wi-Fi
    timeout: 15000
- assertVisible: 'UI TEST.*SIMULATED TV.*'
- tapOn: Up
- tapOn: OK
- tapOn: Home
- takeScreenshot: simulated-remote
- tapOn: Use touchpad
- assertVisible: 'Swipe to navigate.*'
- tapOn: Settings
- tapOn: Dark
- assertVisible: Dark · Selected
- tapOn: Light
- assertVisible: Light · Selected
- takeScreenshot: simulated-settings
- tapOn: Remote
- assertVisible: 'Swipe to navigate.*'
- assertVisible: Connected · Local Wi-Fi
- tapOn: Use direction buttons
- tapOn: Saved
- back
- assertVisible: Connected · Local Wi-Fi
- tapOn: Saved
- tapOn: Rename Living Room · Simulated
- tapOn: Device name
- eraseText: 1
- inputText: Lounge
- assertVisible: Lounge
- assertVisible: Save name
- takeScreenshot: simulated-rename-keyboard
- tapOn: Save name
- assertVisible: Lounge
- tapOn: Connect to Lounge
- extendedWaitUntil:
    visible: Connected · Local Wi-Fi
    timeout: 15000
- tapOn: Saved
- scrollUntilVisible:
    element: Forget Lounge
- tapOn: Forget Lounge
- tapOn: Forget TV
- assertVisible: No saved TVs yet.
- takeScreenshot: simulated-forgotten
- tapOn: Remote
- assertVisible: Choose a TV
